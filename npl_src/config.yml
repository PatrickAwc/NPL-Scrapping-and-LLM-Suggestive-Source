# ===== Project paths =====
data_folder: data                 # where t_panel.csv lives
models_folder: data/interim/models  # where trained models will be saved
reports_folder: reports           # monitoring outputs (figures/, tables/, run logs)
print_metrics: true
print_forecast: true

# Minimum rows check after lagging
min_rows_after_lag: 100

# Ridge-regularized SC-MIDAS OLS (used by sc_midas.py)
sc_midas_ols:
  alpha: 0.01
  ar_lags: 3
  gdp_lags: 4
  degu_lags: 4
  cblr_lags: 4
  gla_lags: 4
  include_const: true

# Optional per-horizon override (if present, takes precedence over alpha)
  # You can remove this block if you want a single alpha for all horizons.
  alpha_per_horizon:
    "3": 0.015
    "4": 0.02
    "5": 0.02
    "6": 0.02

# ===== Reproducibility =====
random_state: 42

# ===== Modeling =====
# Choose between: 'midas_ml' (MIDAS-style features + ML) or 'sc_midas_ols' (constrained OLS MIDAS)
model_type_per_horizon:
  "0": midas_ml
  "1": midas_ml
  "2": midas_ml
  "3": sc_midas_ols
  "4": sc_midas_ols
  "5": sc_midas_ols
  "6": sc_midas_ols
# Fallback if a horizon key is missing:
model_type: midas_ml

# Train direct models for each horizon below (months ahead)
horizons: [0, 1, 2, 3, 4, 5, 6]

# Column name for the supervised target vector created in features.py
target_col: y_target

# ===== Feature construction (used by features.py) =====
features:
  npl_auto_lags: 12              # number of ln(NPL) autoregressive lags
  hi_freq_lags: 6                # number of lags for high-frequency blocks (CBLR/DEGU/GLA)
  gdp_months: 12                # number of monthly GDP lags to include in MIDAS
  beta_shape: [3.0, 4.5]         # Beta(a,b) weights for GDP MIDAS (1..L); a>1 biases recent months
  #reverse_midas: false           # reverse order (more weight to most recent or furthest month)
  add_rolling_windows: true
  rolling_windows: [3, 6]  # pick any set of window lengths (months)
  scoring_entrypoint: auto       # or e.g., make_X_for_h

# ===== Modeling hyperparameters (used by pipeline.py) =====
lgbm:
  objective: huber            # robust to outliers; use lgbm.alpha to set tail
  reg_alpha: 0.05
  reg_lambda: 0.5
  min_split_gain: 0.0
  alpha: 0.9
  metric: l1
  learning_rate: 0.02
  n_estimators: 3500
  num_leaves: 63
  min_child_samples: 15
  subsample: 0.8
  colsample_bytree: 0.85
  min_sum_hessian_in_leaf: 0.001
  max_depth: -1
  max_bin: 511
  force_col_wise: true
  feature_pre_filter: false
  bagging_fraction: 0.8
  bagging_freq: 1
  feature_fraction: 0.8
  early_stopping_rounds: 300

ridge:
  alpha: 1.0

# ===== Cross-validation =====
cv:
  folds: 5                         # TimeSeriesSplit folds
  rolling_origin_backtest: true    # do leakage-safe rolling-origin evaluation for each horizon
  min_train_points: 84             # minimum training window (months)
  min_valid_points: 12             # minimum validation window (months) for rolling origin

test:
  window_months: 12        # last 12 months (shifted by h) used as an external test window


# ===== KPI gates (pp errors on linear NPL where applicable; R² on log) =====
gates:
  strick: false
  h0:
    rmse_pp_max: 1.20
    mae_pp_max: 1.20
    smape_max: 7.0
    r2_log_min: 0.20
  h3:
    rmse_pp_max: 2.20
    mae_pp_max: 1.70
    smape_max: 9.0
    r2_log_min: 0.25
  h6:
    rmse_pp_max: 2.80
    mae_pp_max: 2.20
    smape_max: 12.0
    r2_log_min: 0.05


# ===== Optional Optuna tuning =====
optuna:
  enabled: true        # set true to enable tuning
  n_trials: 120          # number of trials
  timeout: null         # seconds; null to ignore
  direction: minimize   # minimize rmse_pp

forecast_guardrails:
  enabled: true
  # hard caps in percentage points per month (domain-informed)
  max_monthly_drop_pp: 0.8   # e.g., NPL shouldn’t fall by >0.8pp in one month
  max_monthly_rise_pp: 1.5   # optional upswing cap
  # statistical sanity: shrink to the 95th pct of historical absolute MoM change
  use_hist_percentile: true
  hist_percentile: 0.95
  # smoothing across horizons after capping (light smoothing)
  smooth_alpha: 0.35   # 0 disables smoothing

monitoring:
  print_metrics: true
  min_train_rows: 60
  backtest_step: 1
  importance:
    perm_metric: mae_pp
    perm_repeats: 5
    lgbm:
      compute_permutation: false
    ols:
      compute_permutation: true
  forecast_guard:
    max_monthly_change_pp: 1.5   # cap month-to-month absolute change
    smooth_if_jump_pp: 2.0       # light anti-whiplash smoothing trigger
  thresholds:
    rmse_pp_max: 3.0
    mae_pp_max: 2.5
    smape_max: 30.0
    mase_max: 1.0
    r2_log_min: 0.20
  gate_window: 36

# --- Additive keys for monitoring.py (no structural changes) ---

# 1) Tell monitoring which column in t_panel is the NPL target (choose ONE of A or B):

npl:
  # A) If your panel has a log column for NPL, set its exact name here (e.g., "ln_npl", "npl_log")
  ln_column_override: ""         # e.g., ln_npl

  # OR B) If your panel has a raw NPL value column, set it here and its unit:
  value_column_override: ""      # e.g., npl or npl_pct
  value_unit_override: ""        # "decimal" if 0.045 means 4.5%; "percent" if 4.5 means 4.5%

# 2) (Optional) Point to the exact feature builder function you used in training
#    Only set this if your features.py entrypoint isn't auto-detected.
#features:
#  scoring_entrypoint: auto       # or e.g., make_X_for_h

# 3) (Recommended) Monitoring gates (you can keep your own numbers)
#monitoring:
#  thresholds:
#    rmse_pp_max: 3.0
#    mae_pp_max: 2.5
#    smape_max: 30.0
#    mase_max: 1.0
#    r2_log_min: 0.20
#  gate_window: 36

dq_thresholds:
  missing_months_max: 0
  duplicates_max: 0
  nan_max: 0
  inf_max: 0
  adf_pvalue_max: 0.10   # used only if --adf

